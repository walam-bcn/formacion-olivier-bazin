<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "IDThin"; src: url("file:///usr/share/fonts/opentype/inter/InterDisplay-Thin.otf"); }
  @font-face { font-family: "IDLight"; src: url("file:///usr/share/fonts/opentype/inter/InterDisplay-ExtraLight.otf"); }
  @font-face { font-family: "IDBlack"; src: url("file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf"); }
  @font-face { font-family: "IDMed"; src: url("file:///usr/share/fonts/opentype/inter/InterDisplay-Medium.otf"); }
  @font-face { font-family: "Mono"; src: url("file:///usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf"); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, CX = W / 2, CY = H / 2;
const DUR = 12;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const snap = document.createElement('canvas'); snap.width = W; snap.height = H;
const sctx = snap.getContext('2d');

// ---------- helpers ----------
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eExpo = x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x);

const ICE = '#eaf6ff';
const CYAN = 'rgba(80,240,255,';
const MAG = 'rgba(255,40,200,';

// grain textures
const grains = [];
{
  const r = rng(7);
  for (let k = 0; k < 6; k++) {
    const g = document.createElement('canvas'); g.width = 360; g.height = 640;
    const gx = g.getContext('2d'); const id = gx.createImageData(360, 640);
    for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 22; }
    gx.putImageData(id, 0, 0); grains.push(g);
  }
}
// scanlines
const scan = document.createElement('canvas'); scan.width = W; scan.height = H;
{ const s = scan.getContext('2d'); s.fillStyle = 'rgba(0,0,0,0.22)'; for (let y = 0; y < H; y += 4) s.fillRect(0, y, W, 2); }

// particles (3D starfield)
const parts = []; { const r = rng(42); for (let i = 0; i < 420; i++) parts.push({ x: (r() - .5) * 3000, y: (r() - .5) * 5000, z: r() * 2000 + 50, s: r() }); }

const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&/<>+=×∆';
function scramble(text, t, start, stagger, seed) {
  // returns array of {ch, state} state: 0 hidden,1 scrambling,2 final
  const out = [];
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const appear = start + i * stagger * 0.5;
    const settle = start + 0.35 + i * stagger;
    if (c === ' ') { out.push({ ch: ' ', st: 2 }); continue; }
    if (t < appear) out.push({ ch: c, st: 0 });
    else if (t < settle) { const f = Math.floor(t * 30 / 2); const r = rng(seed * 997 + i * 131 + f)(); out.push({ ch: GLYPHS[Math.floor(r * GLYPHS.length)], st: 1 }); }
    else out.push({ ch: c, st: 2 });
  }
  return out;
}

function drawSpaced(chars, x, y, font, size, spacing, fill, align = 'center', stroke = false) {
  ctx.letterSpacing = "0px"; ctx.textAlign = "left";
  ctx.font = `${size}px ${font}`;
  ctx.textBaseline = 'middle';
  const widths = chars.map(c => ctx.measureText(c.ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
  let px = align === 'center' ? x - total / 2 : x;
  chars.forEach((c, i) => {
    if (c.st !== 0) {
      if (c.st === 1) { ctx.save(); ctx.globalAlpha *= 0.75; }
      const col = c.st === 1 ? (i % 2 ? CYAN + '1)' : MAG + '1)') : fill;
      if (stroke && c.st === 2) { ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.strokeText(c.ch, px, y); }
      else { ctx.fillStyle = col; ctx.fillText(c.ch, px, y); }
      if (c.st === 1) ctx.restore();
    }
    px += widths[i] + spacing;
  });
  return total;
}
function measureSpaced(text, font, size, spacing) {
  ctx.letterSpacing = "0px";
  ctx.font = `${size}px ${font}`;
  let w = 0; for (const c of text) w += ctx.measureText(c).width; return w + spacing * (text.length - 1);
}
function fitSize(text, font, spacingRatio, maxW, start) {
  let s = start; while (s > 10 && measureSpaced(text, font, s, s * spacingRatio) > maxW) s -= 2; return s;
}

// chromatic triple draw: fn(dx) draws in given color
function chroma(off, alpha, fn) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha *= alpha;
  ctx.translate(-off, 0); fn('rgb(255,30,90)');
  ctx.translate(off, off * 0.3); fn('rgb(40,255,140)');
  ctx.translate(off, -off * 0.3); fn('rgb(60,120,255)');
  ctx.restore();
}

// ---------- scene pieces ----------
function bg(t) {
  ctx.fillStyle = '#030305'; ctx.fillRect(0, 0, W, H);
  // deep radial glow
  const k = lin(t, 1.0, 3.0) * (1 - lin(t, 11.2, 12));
  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 1100);
  g.addColorStop(0, `rgba(40,70,110,${0.35 * k})`);
  g.addColorStop(0.5, `rgba(60,20,90,${0.18 * k})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function floorGrid(t) {
  const a = lin(t, 1.2, 2.4) * (1 - lin(t, 11.0, 11.6));
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a * 0.55;
  const horizon = H * 0.62;
  ctx.strokeStyle = 'rgba(120,200,255,0.5)'; ctx.lineWidth = 1.5;
  // vertical lines converge
  for (let i = -24; i <= 24; i++) {
    ctx.beginPath(); ctx.moveTo(CX + i * 18, horizon); ctx.lineTo(CX + i * 260, H + 40); ctx.stroke();
  }
  // horizontal moving lines
  const speed = (t * 0.9) % 1;
  for (let j = 0; j < 22; j++) {
    const z = (j + 1 - speed); const y = horizon + Math.pow(z / 22, 2.2) * (H - horizon + 60);
    ctx.globalAlpha = a * 0.55 * clamp(z / 6);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  // fade near horizon
  const fg = ctx.createLinearGradient(0, horizon - 10, 0, horizon + 260);
  fg.addColorStop(0, 'rgba(3,3,5,1)'); fg.addColorStop(1, 'rgba(3,3,5,0)');
  ctx.globalAlpha = 1; ctx.fillStyle = fg; ctx.fillRect(0, horizon - 10, W, 270);
  ctx.restore();
}

function starfield(t) {
  const a = lin(t, 1.2, 2.2) * (1 - lin(t, 11.0, 11.5));
  if (a <= 0) return;
  // warp speed boost around the impact
  const boost = 1 + 6 * Math.exp(-Math.pow((t - 5.1) / 0.25, 2));
  ctx.save();
  for (const p of parts) {
    let z = ((p.z - t * 260 * (0.6 + p.s)) % 2000 + 2000) % 2000 + 30;
    const f = 600 / z;
    const x = CX + p.x * f * 0.25, y = CY + p.y * f * 0.25;
    if (x < 0 || x > W || y < 0 || y > H) continue;
    const r = Math.max(0.6, 2.4 * f * 0.4);
    const len = boost > 1.2 ? (boost - 1) * 6 * f : 0;
    ctx.globalAlpha = a * clamp(1 - z / 2000) * 0.9;
    ctx.strokeStyle = ctx.fillStyle = p.s > .85 ? '#ff7ad9' : (p.s > .7 ? '#7ef6ff' : '#dfe9ff');
    if (len > 1) {
      const dx = x - CX, dy = y - CY, d = Math.hypot(dx, dy) || 1;
      ctx.lineWidth = r; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx / d * len, y + dy / d * len); ctx.stroke();
    } else { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.restore();
}

function laser(t) {
  // intro line growing, and outro collapse
  let w = 0, a = 0, y = CY;
  if (t < 1.6) { w = eExpo(lin(t, 0.25, 1.2)) * W; a = 1 - lin(t, 1.25, 1.6); }
  if (t > 11.0) { const k = lin(t, 11.0, 11.55); w = (1 - eIn(k)) * W * 0.9 + 4; a = 1 - lin(t, 11.75, 12); }
  if (a <= 0 || w <= 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++) {
    const th = [2, 8, 24, 70][i], al = [1, .5, .22, .1][i];
    const g = ctx.createLinearGradient(CX - w / 2, 0, CX + w / 2, 0);
    g.addColorStop(0, 'rgba(120,230,255,0)'); g.addColorStop(.5, `rgba(235,250,255,${al * a})`); g.addColorStop(1, 'rgba(255,90,220,0)');
    ctx.fillStyle = g; ctx.fillRect(CX - w / 2, y - th / 2, w, th);
  }
  // hot core dot
  const cg = ctx.createRadialGradient(CX, y, 0, CX, y, 120);
  cg.addColorStop(0, `rgba(255,255,255,${a})`); cg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = cg; ctx.fillRect(CX - 120, y - 120, 240, 240);
  ctx.restore();
}

function ring(t) {
  const a = eOut(lin(t, 1.6, 2.2)) * (1 - lin(t, 10.9, 11.4));
  if (a <= 0) return;
  const post5 = eOut(lin(t, 5.0, 6.5));
  const R = 400 * (1 + 0.55 * post5);
  ctx.save(); ctx.translate(CX, CY); ctx.globalAlpha = a * (1 - 0.8 * post5);
  // outer ticks rotating
  ctx.rotate(t * 0.25);
  for (let i = 0; i < 120; i++) {
    const ang = i / 120 * Math.PI * 2, big = i % 10 === 0;
    ctx.strokeStyle = big ? 'rgba(234,246,255,0.9)' : 'rgba(234,246,255,0.35)';
    ctx.lineWidth = big ? 3 : 1.5;
    const r1 = R + 20, r2 = R + (big ? 56 : 36);
    ctx.beginPath(); ctx.moveTo(Math.cos(ang) * r1, Math.sin(ang) * r1); ctx.lineTo(Math.cos(ang) * r2, Math.sin(ang) * r2); ctx.stroke();
  }
  ctx.rotate(-t * 0.25 - t * 0.6);
  // dashed inner ring counter-rotating
  ctx.setLineDash([4, 18]); ctx.strokeStyle = 'rgba(126,246,255,0.6)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, R - 30, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  ctx.rotate(t * 0.6);
  // progress arc during the countdown
  let prog = 0;
  if (t >= 2 && t < 5) prog = (t - 2) % 1;
  else if (t >= 5) prog = 1;
  ctx.strokeStyle = 'rgba(234,246,255,0.18)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
  ctx.shadowColor = 'rgba(126,246,255,1)'; ctx.shadowBlur = 30;
  ctx.strokeStyle = t < 5 ? '#eaf6ff' : 'rgba(255,90,220,0.9)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * eIO(prog)); ctx.stroke();
  // leading dot
  if (t < 5 && t >= 2) {
    const ang = -Math.PI / 2 + Math.PI * 2 * eIO(prog);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(Math.cos(ang) * R, Math.sin(ang) * R, 9, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function countdown(t) {
  if (t < 1.9 || t > 5.1) return;
  const idx = Math.floor(t - 2); // 0,1,2
  if (idx < 0 && t < 2) return;
  const digit = ['3', '2', '1'][clamp(idx, 0, 2)];
  const lt = t - 2 - clamp(idx, 0, 2); // 0..1 local
  const enter = eExpo(lin(lt, 0, 0.25));
  const exit = lin(lt, 0.82, 1);
  const scale = 1.35 - 0.35 * enter + 0.15 * exit;
  const alpha = enter * (1 - exit);
  const off = 26 * (1 - enter) + 40 * exit + 4;
  ctx.save(); ctx.translate(CX, CY + 20); ctx.scale(scale, scale);
  chroma(off, alpha, col => {
    ctx.font = '640px IDThin'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = col; ctx.fillText(digit, 0, 0);
  });
  ctx.restore();
  // micro label
  ctx.save(); ctx.globalAlpha = alpha * 0.85; ctx.fillStyle = ICE; ctx.font = '26px Mono'; ctx.textAlign = 'center';
  ctx.letterSpacing = '10px';
  ctx.fillText(`T — 0${digit} : 00`, CX, CY + 560);
  ctx.restore();
}

function flash(t) {
  const k = Math.exp(-Math.pow((t - 5.05) / 0.09, 2));
  const sw = lin(t, 5.0, 6.2);
  if (k > 0.01) { ctx.fillStyle = `rgba(240,250,255,${k * 0.95})`; ctx.fillRect(0, 0, W, H); }
  if (sw > 0 && sw < 1) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const r = eOut(sw) * 1400;
    ctx.strokeStyle = `rgba(126,246,255,${(1 - sw) * 0.8})`; ctx.lineWidth = 40 * (1 - sw) + 2;
    ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = `rgba(255,60,210,${(1 - sw) * 0.6})`; ctx.lineWidth = 12 * (1 - sw) + 1;
    ctx.beginPath(); ctx.arc(CX, CY, r * 0.82, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

let ES1S, ES2S, EN1S, EN2S;
function titles(t) {
  if (t < 5.1) return;
  const out = 1 - lin(t, 10.8, 11.3);
  // Spanish (hero)
  const l1 = 'EMPIEZA LA', l2 = 'CUENTA ATRÁS';
  const sp = 0.06;
  if (!ES2S) { ES2S = fitSize(l2, 'IDBlack', sp, 860, 220); ES1S = ES2S; EN2S = fitSize('THE COUNTDOWN', 'IDLight', 0.18 * 1.25, 780, 120); EN1S = EN2S; }
  const track = 1 + 0.35 * (1 - eOut(lin(t, 5.2, 7.2)));
  const yES = CY - 120;
  const c1 = scramble(l1, t, 5.25, 0.045, 11), c2 = scramble(l2, t, 5.45, 0.045, 23);
  const off = 3 + 14 * Math.exp(-(t - 5.25) * 3) + glitchAmt(t) * 30;
  ctx.save(); ctx.globalAlpha = out;
  chroma(off, 1, col => {
    drawSpaced(c1, CX, yES - ES1S * 0.55, 'IDBlack', ES1S, ES1S * sp * track, col);
    drawSpaced(c2, CX, yES + ES2S * 0.5, 'IDBlack', ES2S, ES2S * sp * track, col);
  });
  // tag ES
  const tagA = lin(t, 5.3, 5.6);
  ctx.globalAlpha = out * tagA; ctx.fillStyle = ICE; ctx.font = '24px Mono'; ctx.textAlign = 'left'; ctx.letterSpacing = '8px';
  ctx.fillText('[ ES ]', 70, yES - ES1S * 1.35);
  ctx.textAlign = 'right'; ctx.fillText('01 / 02', W - 70, yES - ES1S * 1.35);

  // divider line
  const dl = eExpo(lin(t, 6.6, 7.4));
  ctx.globalAlpha = out; ctx.fillStyle = 'rgba(234,246,255,0.7)';
  ctx.fillRect(CX - dl * 380, yES + ES2S * 1.25, dl * 760, 2);
  ctx.fillStyle = 'rgba(255,60,210,1)'; ctx.fillRect(CX - 6, yES + ES2S * 1.25 - 5, 12 * dl, 12 * dl);

  // English
  const yEN = yES + ES2S * 1.25 + 170;
  const e1 = scramble('THE COUNTDOWN', t, 7.3, 0.04, 37), e2 = scramble('BEGINS', t, 7.75, 0.06, 51);
  const etrack = 1 + 0.25 * (1 - eOut(lin(t, 7.3, 9.6)));
  ctx.globalAlpha = out;
  drawSpaced(e1, CX, yEN, 'IDLight', EN1S, EN1S * 0.18 * etrack, ICE);
  drawSpaced(e2, CX, yEN + EN1S * 1.15, 'IDThin', EN1S * 1.0, EN1S * 0.32 * etrack, ICE, 'center', false);
  const tagB = lin(t, 7.35, 7.7);
  ctx.globalAlpha = out * tagB; ctx.fillStyle = ICE; ctx.font = '24px Mono'; ctx.letterSpacing = '8px';
  ctx.textAlign = 'left'; ctx.fillText('[ EN ]', 70, yEN - EN1S * 0.95);
  ctx.textAlign = 'right'; ctx.fillText('02 / 02', W - 70, yEN - EN1S * 0.95);
  ctx.restore();
}

function hud(t) {
  const a = lin(t, 1.4, 2.0) * (1 - lin(t, 11.0, 11.5));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = 'rgba(234,246,255,0.8)'; ctx.lineWidth = 2;
  const m = 56, L = 70;
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) => {
    ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.stroke();
  });
  ctx.fillStyle = 'rgba(234,246,255,0.75)'; ctx.font = '22px Mono'; ctx.letterSpacing = '6px';
  // remaining time readout
  const remain = Math.max(0, 5 - t);
  const tc = t < 5 ? `00:00:0${Math.floor(remain)}:${String(Math.floor((remain % 1) * 100)).padStart(2, '0')}` : '00:00:00:00';
  ctx.textAlign = 'left'; ctx.fillText('SYS / INIT', m + 20, m + 110);
  ctx.fillText(tc, m + 20, m + 146);
  ctx.textAlign = 'right'; ctx.fillText('41.3851° N', W - m - 20, m + 110); ctx.fillText('2.1734° E', W - m - 20, m + 146);
  ctx.textAlign = 'left';
  // blinking rec
  if (Math.floor(t * 2) % 2 === 0) { ctx.fillStyle = 'rgba(255,40,90,1)'; ctx.beginPath(); ctx.arc(m + 30, H - m - 120, 9, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = 'rgba(234,246,255,0.75)'; ctx.fillText('LIVE', m + 52, H - m - 112);
  ctx.textAlign = 'right'; ctx.fillText(`FR ${String(Math.floor(t * 30)).padStart(4, '0')}`, W - m - 20, H - m - 112);
  // bottom bar segmented
  const segs = 40, bw = W - 2 * m - 40;
  for (let i = 0; i < segs; i++) {
    const on = i / segs < clamp(t / 11);
    ctx.fillStyle = on ? 'rgba(234,246,255,0.85)' : 'rgba(234,246,255,0.15)';
    ctx.fillRect(m + 20 + i * (bw / segs), H - m - 70, bw / segs - 6, 6);
  }
  ctx.restore();
}

function glitchAmt(t) {
  // deterministic bursts
  const bursts = [1.95, 2.95, 3.95, 5.02, 5.3, 6.4, 7.28, 8.9, 9.7, 10.85];
  let g = 0; for (const b of bursts) g = Math.max(g, Math.exp(-Math.pow((t - b) / 0.06, 2)));
  return g;
}

function glitchSlices(t, f) {
  const g = glitchAmt(t);
  if (g < 0.08) return;
  sctx.clearRect(0, 0, W, H); sctx.drawImage(cv, 0, 0);
  const r = rng(f * 13 + 5);
  const n = Math.floor(4 + g * 10);
  for (let i = 0; i < n; i++) {
    const y = Math.floor(r() * H), h = Math.floor(8 + r() * 90), dx = (r() - .5) * 160 * g;
    ctx.drawImage(snap, 0, y, W, h, dx, y, W, h);
    if (r() > 0.6) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = r() > .5 ? CYAN + (0.18 * g) + ')' : MAG + (0.18 * g) + ')'; ctx.fillRect(0, y, W, h); ctx.restore(); }
  }
}

function post(t, f) {
  // scanlines, grain, vignette
  ctx.drawImage(scan, 0, 0);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.9;
  ctx.drawImage(grains[f % grains.length], 0, 0, W, H); ctx.restore();
  const v = ctx.createRadialGradient(CX, CY, H * 0.25, CX, CY, H * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // final fade
  const fo = lin(t, 11.7, 12);
  if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
}

window.render = function (t) {
  const f = Math.round(t * 30);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.letterSpacing = '0px';
  // camera shake after impact
  const shake = 14 * Math.exp(-(t - 5.0) * 5) * (t > 5 ? 1 : 0);
  const sr = rng(f + 99);
  bg(t);
  ctx.save(); ctx.translate((sr() - .5) * shake, (sr() - .5) * shake);
  starfield(t); floorGrid(t); ring(t); countdown(t); titles(t); laser(t);
  ctx.restore();
  hud(t); flash(t); glitchSlices(t, f); post(t, f);
};

window.ready = (async () => {
  const fams = ['IDThin', 'IDLight', 'IDBlack', 'IDMed', 'Mono'];
  await Promise.all(fams.map(f => document.fonts.load(`40px ${f}`, 'AÁ0')));
  await document.fonts.ready;
  return true;
})();
</script>
</body>
</html>
