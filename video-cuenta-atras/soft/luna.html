<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Corm"; src: url("../fonts/Cormorant.ttf"); font-weight: 300 700; }
  @font-face { font-family: "CormI"; src: url("../fonts/CormorantItalic.ttf"); font-weight: 300 700; }
  @font-face { font-family: "Vibes"; src: url("../fonts/GreatVibes.ttf"); }
  html, body { margin: 0; background: #101a38; overflow: hidden; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="common.js"></script>
<script>
// "Luna": a calm night over still water. Each count drops a ripple; a shooting star carries the wish.
const CREAM = '#f5efe4', GOLD = '#ecd6a4';
const HZ = 1380; // horizon
const stars = []; { const r = rng(3); for (let i = 0; i < 230; i++) stars.push({ x: r() * W, y: r() * HZ, s: r(), p: r() * 6.28 }); }
const flies = []; { const r = rng(15); for (let i = 0; i < 26; i++) flies.push({ x: r() * W, y: HZ - 40 + r() * 480, p: r() * 6.28, s: r() }); }
const MOON = { x: 830, y: 300, r: 85 };

function nightSky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, HZ);
  g.addColorStop(0, '#0b1430'); g.addColorStop(0.55, '#24356a'); g.addColorStop(0.85, '#6a5d8f'); g.addColorStop(1, '#c49bb0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HZ);
  for (const s of stars) {
    const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * (1 + s.s * 2) + s.p));
    ctx.globalAlpha = tw * (1 - s.y / HZ * 0.7);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, 0.6 + s.s * 1.6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // moon + halo
  const halo = ctx.createRadialGradient(MOON.x, MOON.y, MOON.r * 0.8, MOON.x, MOON.y, MOON.r * 6);
  halo.addColorStop(0, 'rgba(255,244,220,0.35)'); halo.addColorStop(1, 'rgba(255,244,220,0)');
  ctx.fillStyle = halo; ctx.fillRect(0, 0, W, HZ);
  const mg = ctx.createRadialGradient(MOON.x - 30, MOON.y - 30, 10, MOON.x, MOON.y, MOON.r);
  mg.addColorStop(0, '#fffaf0'); mg.addColorStop(1, '#efe2c6');
  ctx.save(); ctx.shadowColor = 'rgba(255,240,210,0.9)'; ctx.shadowBlur = 60;
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(MOON.x, MOON.y, MOON.r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.fillStyle = 'rgba(210,195,170,0.25)';
  [[-30, -20, 18], [25, 15, 12], [-10, 40, 9]].forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(MOON.x + dx, MOON.y + dy, r, 0, Math.PI * 2); ctx.fill(); });
}
function water(t) {
  const g = ctx.createLinearGradient(0, HZ, 0, H);
  g.addColorStop(0, '#5a5182'); g.addColorStop(0.3, '#26315e'); g.addColorStop(1, '#0b1228');
  ctx.fillStyle = g; ctx.fillRect(0, HZ, W, H - HZ);
  // moon reflection: shimmering horizontal strokes
  const r = rng(Math.floor(t * 8));
  for (let i = 0; i < 46; i++) {
    const y = HZ + 10 + i * 11 + Math.pow(i, 1.4);
    if (y > H) break;
    const w = (40 + r() * 120) * (1 + i * 0.03);
    const x = MOON.x + Math.sin(t * 1.3 + i * 0.7) * (6 + i * 0.6) - w / 2;
    ctx.fillStyle = `rgba(255,240,210,${0.55 * (1 - i / 46)})`;
    ctx.fillRect(x, y, w, 2 + i * 0.06);
  }
  // soft horizon mist
  const m = ctx.createLinearGradient(0, HZ - 60, 0, HZ + 80);
  m.addColorStop(0, 'rgba(220,190,210,0)'); m.addColorStop(.5, 'rgba(220,190,210,0.3)'); m.addColorStop(1, 'rgba(220,190,210,0)');
  ctx.fillStyle = m; ctx.fillRect(0, HZ - 60, W, 140);
}
function ripples(t) {
  const drops = [...T.nums, T.es + 0.2];
  drops.forEach((s, i) => {
    for (let k = 0; k < 3; k++) {
      const lt = t - s - k * 0.28; if (lt < 0 || lt > 3.5) continue;
      const p = lt / 3.5, rx = 40 + p * 520, a = (1 - p) * 0.6;
      ctx.strokeStyle = `rgba(255,240,215,${a})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(CX, 1620, rx, rx * 0.16, 0, 0, Math.PI * 2); ctx.stroke();
    }
  });
}
function fireflies(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const f of flies) {
    const x = f.x + Math.sin(t * 0.5 + f.p) * 40, y = f.y + Math.cos(t * 0.4 + f.p * 2) * 30;
    const a = 0.25 + 0.75 * Math.max(0, Math.sin(t * (0.8 + f.s) + f.p));
    const g = ctx.createRadialGradient(x, y, 0, x, y, 26);
    g.addColorStop(0, `rgba(255,226,150,${a})`); g.addColorStop(1, 'rgba(255,226,150,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 26, y - 26, 52, 52);
  }
  ctx.restore();
}
function shootingStar(t) {
  const lt = lin(t, T.date - 0.3, T.date + 1.0);
  if (lt <= 0 || lt >= 1) return;
  const x0 = 980, y0 = 180, x1 = 120, y1 = 620;
  const x = mix(x0, x1, eOut(lt)), y = mix(y0, y1, eOut(lt));
  const g = ctx.createLinearGradient(x, y, x + 260, y - 130);
  g.addColorStop(0, `rgba(255,250,235,${1 - lt})`); g.addColorStop(1, 'rgba(255,250,235,0)');
  ctx.save(); ctx.strokeStyle = g; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 260, y - 130); ctx.stroke();
  ctx.fillStyle = `rgba(255,255,255,${1 - lt})`; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

let S1, SEN;
window.render = function (t) {
  reset();
  nightSky(t); shootingStar(t); water(t); ripples(t); fireflies(t);
  const out = 1 - lin(t, T.out, T.out + 0.8);
  softNumber(t, 'CormI', 640, CREAM, CY - 120, { glow: 'rgba(255,236,200,0.7)' });
  if (!S1) { S1 = fitFont('cuenta atrás', 'Corm', 820, 190, 300); SEN = fitFont('The countdown begins', 'Vibes', 800, 140); }
  const y0 = CY - 360;
  revealWords('Empieza la', CX, y0, 'Corm', S1, CREAM, t, T.es, 0.25, 1.2, { fadeOut: out, weight: 300 });
  revealWords('cuenta atrás', CX, y0 + S1 * 0.95, 'Corm', S1, CREAM, t, T.es + 0.45, 0.25, 1.2, { fadeOut: out, weight: 300 });
  revealWords('The countdown begins', CX, y0 + S1 * 0.95 + 220, 'Vibes', SEN, GOLD, t, T.en, 0.35, 1.4, { fadeOut: out });
  dateMark(t, y0 + S1 * 0.95 + 360, 'CormI', 60, CREAM, { fadeOut: out });
  revealWords('pide un deseo · make a wish', CX, y0 + S1 * 0.95 + 450, 'CormI', 52, 'rgba(236,214,164,0.95)', t, T.date + 0.6, 0.12, 1.2, { fadeOut: out, weight: 400 });
  finish(t, '11,20,48');
};
window.ready = loadFonts(['Corm', 'CormI', 'Vibes']);
</script></body></html>
