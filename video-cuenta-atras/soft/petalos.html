<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Corm"; src: url("../fonts/Cormorant.ttf"); font-weight: 300 700; }
  @font-face { font-family: "CormI"; src: url("../fonts/CormorantItalic.ttf"); font-weight: 300 700; }
  @font-face { font-family: "Paris"; src: url("../fonts/Parisienne.ttf"); }
  html, body { margin: 0; background: #fbf4ee; overflow: hidden; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="common.js"></script>
<script>
// "Pétalos": cream paper, watercolour blush, petals drifting down, a tiny candle.
const ROSE = '#a8566c', INK = '#5a3d47';
const petals = []; { const r = rng(77); for (let i = 0; i < 46; i++) petals.push({ x: r() * W, y: r() * H * 1.4 - H * 0.4, s: 0.5 + r() * 0.9, v: 40 + r() * 70, sw: 30 + r() * 60, ph: r() * 6.28, rot: r() * 6.28, rv: (r() - .5) * 1.6, hue: r() }); }
const blobs = [
  { x: 220, y: 380, r: 420, c: '244,186,196' }, { x: 900, y: 620, r: 380, c: '250,214,190' },
  { x: 160, y: 1500, r: 460, c: '214,226,204' }, { x: 920, y: 1640, r: 420, c: '244,190,204' },
  { x: 560, y: 980, r: 520, c: '255,232,226' },
];

function paper(t) {
  ctx.fillStyle = '#fbf4ee'; ctx.fillRect(0, 0, W, H);
  blobs.forEach((b, i) => {
    const br = b.r * (1 + 0.06 * Math.sin(t * 0.7 + i * 1.7));
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, br);
    g.addColorStop(0, `rgba(${b.c},0.55)`); g.addColorStop(0.6, `rgba(${b.c},0.25)`); g.addColorStop(1, `rgba(${b.c},0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  });
}
function petal(x, y, s, rot, hue, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s * (0.55 + 0.45 * Math.abs(Math.cos(rot * 1.3))));
  const g = ctx.createLinearGradient(0, -26, 0, 26);
  const c1 = hue > .6 ? '255,214,222' : (hue > .25 ? '247,178,196' : '255,236,230');
  g.addColorStop(0, `rgba(${c1},${a})`); g.addColorStop(1, `rgba(226,140,164,${a})`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0, -28);
  ctx.bezierCurveTo(22, -20, 22, 16, 0, 28); ctx.bezierCurveTo(-22, 16, -22, -20, 0, -28); ctx.fill();
  ctx.strokeStyle = `rgba(200,110,140,${a * 0.35})`; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(0, 20); ctx.stroke();
  ctx.restore();
}
function drawPetals(t, front) {
  petals.forEach((p, i) => {
    if ((i % 3 === 0) !== front) return;
    const y = ((p.y + t * p.v) % (H + 200)) - 100;
    const x = p.x + Math.sin(t * 0.8 + p.ph) * p.sw;
    const sc = front ? p.s * 1.6 : p.s;
    if (front) { ctx.save(); ctx.filter = 'blur(3px)'; }
    petal(x, y, sc, p.rot + t * p.rv, p.hue, front ? 0.85 : 0.75);
    if (front) ctx.restore();
  });
}
// a hand-drawn circle that traces around each number
function circle(t) {
  T.nums.forEach((s, i) => {
    const lt = t - s; if (lt < 0 || lt > 1) return;
    const k = eIO(lin(lt, 0, 0.8)), a = 1 - lin(lt, 0.7, 1);
    ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = 'rgba(168,86,108,0.6)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let j = 0; j <= 120 * k; j++) {
      const ang = -Math.PI / 2 + j / 120 * Math.PI * 2.08;
      const rr = 300 + Math.sin(ang * 3 + i) * 6;
      const x = CX + Math.cos(ang) * rr, y = CY - 40 + Math.sin(ang) * rr;
      j ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke(); ctx.restore();
  });
}
function candle(t, x, y, out) {
  const k = eOut(lin(t, T.date + 0.4, T.date + 1.6)) * out;
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k;
  // body
  const g = ctx.createLinearGradient(x - 9, 0, x + 9, 0);
  g.addColorStop(0, '#f2c9d2'); g.addColorStop(.5, '#fde7ec'); g.addColorStop(1, '#e8b3c0');
  ctx.fillStyle = g; ctx.fillRect(x - 9, y, 18, 70);
  ctx.strokeStyle = 'rgba(168,86,108,0.4)'; ctx.lineWidth = 3;
  for (let j = 0; j < 4; j++) { ctx.beginPath(); ctx.moveTo(x - 9, y + 10 + j * 16); ctx.lineTo(x + 9, y + 2 + j * 16); ctx.stroke(); }
  ctx.fillStyle = INK; ctx.fillRect(x - 1, y - 10, 2, 10);
  // flame flicker
  const fl = 1 + 0.08 * Math.sin(t * 17) + 0.05 * Math.sin(t * 29);
  const glow = ctx.createRadialGradient(x, y - 26, 0, x, y - 26, 90);
  glow.addColorStop(0, 'rgba(255,200,120,0.55)'); glow.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = glow; ctx.fillRect(x - 90, y - 116, 180, 180);
  ctx.translate(x + Math.sin(t * 5) * 1.5, y - 12); ctx.scale(1, fl);
  const fg = ctx.createRadialGradient(0, -14, 1, 0, -10, 22);
  fg.addColorStop(0, '#fffbe8'); fg.addColorStop(.5, '#ffd27a'); fg.addColorStop(1, 'rgba(255,140,60,0)');
  ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(0, -38); ctx.bezierCurveTo(14, -20, 12, 0, 0, 2); ctx.bezierCurveTo(-12, 0, -14, -20, 0, -38); ctx.fill();
  ctx.restore();
}

let S1, SEN;
window.render = function (t) {
  reset();
  paper(t); drawPetals(t, false);
  const out = 1 - lin(t, T.out, T.out + 0.8);
  circle(t);
  softNumber(t, 'CormI', 600, ROSE, CY - 40);
  if (!S1) { S1 = fitFont('cuenta atrás', 'CormI', 800, 190, 400); SEN = fitFont('The countdown begins', 'Paris', 760, 120); }
  revealWords('Empieza la', CX, CY - 200, 'CormI', S1, INK, t, T.es, 0.25, 1.2, { fadeOut: out, weight: 400 });
  revealWords('cuenta atrás', CX, CY - 200 + S1 * 0.95, 'CormI', S1, INK, t, T.es + 0.45, 0.25, 1.2, { fadeOut: out, weight: 400 });
  // little floral divider: line · dot · line
  const lk = eIO(lin(t, T.es + 1.2, T.es + 2.4)) * out;
  ctx.fillStyle = 'rgba(168,86,108,0.55)';
  ctx.fillRect(CX - 30 - 120 * lk, CY + 95, 120 * lk, 1.5); ctx.fillRect(CX + 30, CY + 95, 120 * lk, 1.5);
  if (lk > 0) petal(CX, CY + 96, 0.5 * lk, Math.PI / 2, 0.4, lk);
  revealWords('The countdown begins', CX, CY + 250, 'Paris', SEN, ROSE, t, T.en, 0.35, 1.4, { fadeOut: out });
  candle(t, CX, CY + 400, out);
  dateMark(t, CY + 540, 'CormI', 62, INK, { fadeOut: out });
  drawPetals(t, true);
  finish(t, '251,244,238');
};
window.ready = loadFonts(['Corm', 'CormI', 'Paris']);
</script></body></html>
