<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "IDLight"; src: url("../fonts/InterDisplay-Light.otf"); }
  @font-face { font-family: "IDXLight"; src: url("../fonts/InterDisplay-ExtraLight.otf"); }
  @font-face { font-family: "IDThin"; src: url("../fonts/InterDisplay-Thin.otf"); }
  @font-face { font-family: "InterL"; src: url("../fonts/Inter-Light.otf"); }
  @font-face { font-family: "IDSemi"; src: url("../fonts/InterDisplay-SemiBold.otf"); }
  @font-face { font-family: "IDMed"; src: url("../fonts/InterDisplay-Medium.otf"); }
  html, body { margin: 0; background: #000; overflow: hidden; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="common.js"></script>
<script>
// Clean, modern version on the full hourglass photo. No particles, no script fonts.
const img = new Image(); img.src = '../fotos/reloj-rosa.jpg';
const WHITE = '#ffffff', SH = 'rgba(20,24,60,0.35)';

function photo(t) {
  const k = eSine(lin(t, 0, 12));
  const sc = Math.max(W / img.width, H / img.height) * mix(1.10, 1.02, k);
  const w = img.width * sc, h = img.height * sc;
  let x = CX - w * 0.5, y = CY - h * 0.5 + mix(24, -24, k);
  x = Math.min(0, Math.max(W - w, x)); y = Math.min(0, Math.max(H - h, y));
  ctx.drawImage(img, x, y, w, h);
}
function grade() {
  // a quiet veil at the top so the white type reads cleanly
  const g = ctx.createLinearGradient(0, 0, 0, 1000);
  g.addColorStop(0, 'rgba(30,30,70,0.28)'); g.addColorStop(0.6, 'rgba(30,30,70,0.14)'); g.addColorStop(1, 'rgba(30,30,70,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 1000);
}
// Fade + un-blur + rise, applied to a whole line
function line(text, y, font, size, t, start, dur, opts = {}) {
  const k = eOut(lin(t, start, start + dur));
  if (k <= 0.001) return;
  ctx.save();
  ctx.globalAlpha = k * (opts.out ?? 1);
  const b = (1 - k) * 12; if (b > 0.3) ctx.filter = `blur(${b.toFixed(1)}px)`;
  ctx.font = `${size}px ${font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  if (opts.track) ctx.letterSpacing = `${Math.round(size * opts.track * (1 + 0.4 * (1 - k)))}px`;
  ctx.shadowColor = opts.strong ? 'rgba(10,14,45,0.6)' : SH; ctx.shadowBlur = opts.strong ? 30 : 24;
  ctx.fillStyle = opts.color || WHITE;
  // letterSpacing adds trailing space after the last glyph; shift to stay centred
  const shift = opts.track ? size * opts.track * (1 + 0.4 * (1 - k)) / 2 : 0;
  ctx.fillText(text, CX + shift, y + (1 - k) * 18);
  ctx.restore();
}
function number(t) {
  T.nums.forEach((s, i) => {
    const lt = t - s; if (lt < -0.05 || lt > 1.05) return;
    const kin = eSine(lin(lt, 0, 0.4)), kout = eSine(lin(lt, 0.65, 1));
    const a = kin * (1 - kout); if (a <= 0.001) return;
    ctx.save(); ctx.globalAlpha = a;
    const b = (1 - kin) * 16 + kout * 18; if (b > 0.3) ctx.filter = `blur(${b.toFixed(1)}px)`;
    ctx.font = '420px IDThin'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = SH; ctx.shadowBlur = 30; ctx.fillStyle = WHITE;
    ctx.fillText(['3', '2', '1'][i], CX, 1150);
    ctx.restore();
  });
}

window.render = function (t) {
  reset();
  photo(t); grade();
  number(t);
  const out = 1 - lin(t, T.out, T.out + 0.8);
  line('14 · 11', 250, 'IDMed', 44, t, T.date, 1.4, { track: 0.5, out });
  line('Empieza la', 430, 'IDXLight', 118, t, T.es, 1.3, { out, track: -0.01 });
  line('cuenta atrás', 560, 'IDXLight', 118, t, T.es + 0.35, 1.3, { out, track: -0.01 });
  // hairline divider
  const lk = eIO(lin(t, T.en - 0.3, T.en + 0.9)) * out;
  if (lk > 0) { ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(CX - 60 * lk, 628, 120 * lk, 1.5); }
  line('THE COUNTDOWN BEGINS', 712, 'IDSemi', 48, t, T.en, 1.4, { track: 0.2, out, strong: true });
  finish(t, '255,247,250');
};
window.ready = (async () => { await img.decode(); return loadFonts(['IDLight', 'IDXLight', 'IDThin', 'InterL', 'IDSemi', 'IDMed']); })();
</script></body></html>
